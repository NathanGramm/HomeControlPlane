# Add these services to whatever compose file (or Portainer stack) already
# runs the rest of your containers.
#
# Networking note: unlike the docker-socket-proxy <-> home-control-plane
# pair below (which share an implicit network because they're defined in
# the same compose file), NPM doesn't reach your other services — Jellyfin,
# Tandoor, Pi-hole, homepage — over a shared Docker network. It hits each
# one at <host-ip>:<published-port>. home-control-plane follows that same
# pattern here for consistency: publish a port, then point an NPM proxy
# host at your server's LAN IP and that port. This is still LAN/Tailscale-only
# — a published Docker port isn't reachable from the internet unless you
# separately add a router port-forward for it, which you should not do here.
#
# Phase 2 change from Phase 1: home-control-plane no longer mounts the
# Docker socket itself. Instead, docker-socket-proxy holds the real socket
# and exposes only the specific calls the dashboard needs (list/inspect
# containers, start, stop) over plain TCP on the internal network — nothing
# else, and nothing published to the host. If the dashboard ever has a bug
# or gets exposed, the blast radius is "start/stop this one container," not
# "full Docker API access." See https://github.com/Tecnativa/docker-socket-proxy
# for the full list of toggles if you want to expose anything more later.

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1    # GET/list/inspect — this alone grants no write access
      # POST must be 1: this proxy's rule order checks POST as a prerequisite
      # gate BEFORE the ALLOW_START/ALLOW_STOP checks below, so POST=0 was
      # silently blocking both actions rather than scoping them down as
      # intended. Every OTHER write action (create, kill, remove, exec, ...)
      # still has no matching ALLOW_* flag here, so it's still denied by the
      # proxy's own catch-all — only start/stop are actually reachable.
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No ports published — reached only by home-control-plane, over the
    # Docker network they share, at docker-socket-proxy:2375.

  home-control-plane:
    build: .   # or push an image and reference it here
    container_name: home-control-plane
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "3001:3000"   # NPM proxies dash.marshmallowmc.com -> <host-ip>:3001
    environment:
      - PORT=3000
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Once `gtnh-minecraft` (below) is up, MINECRAFT_HOST is just its
      # container name — they land on the same default network because
      # they're defined in this same compose file, so dashboard-to-container
      # traffic never touches the published port at all. Confirmed via
      # server.properties: server-port is already set to 25564 (not
      # Minecraft's 25565 default), matching the port your SRV record
      # publishes externally — so it's the same 25564 on both sides here.
      - MINECRAFT_CONTAINER_NAME=gtnh-minecraft
      - MINECRAFT_HOST=gtnh-minecraft
      - MINECRAFT_PORT=25564
      - FAMILY_MINECRAFT_CONTAINER_NAME=family-minecraft
      - FAMILY_MINECRAFT_HOST=family-minecraft
      - FAMILY_MINECRAFT_PORT=25566
      # Same reasoning as MINECRAFT_HOST above — firefly-app's container
      # name works directly since they share this compose file's network.
      - FIREFLY_URL=http://firefly-app:8080
      # Can't be set until Firefly exists and you've logged in once to
      # create a Personal Access Token from its own UI — see README.
      # Leaving this blank/unset is fine: the dashboard just hides the
      # Finances section entirely until a real token is here.
      - FIREFLY_API_TOKEN=${FIREFLY_API_TOKEN:-}

  # GTNH server — see README's "Moving Minecraft into a container" section
  # before touching this on the real host. Bind-mounts the *existing*
  # ~/GTNHServer directory as-is (world, mods, config, whitelist, ops,
  # server.properties, the works) rather than copying anything, so there's
  # exactly one copy of your world at all times.
  gtnh-minecraft:
    profiles: ["gtnh"]   # stack redeploys skip it; see family-minecraft below
    image: itzg/minecraft-server:java17
    container_name: gtnh-minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 600s   # must exceed STOP_DURATION below, or Compose SIGKILLs mid-save
    ports:
      - "25564:25564"   # matches server.properties' server-port=25564 — no port-forward/SRV change needed
    volumes:
      - /home/ncgramm/GTNHServer:/data
    environment:
      - EULA=TRUE
      # Creates /tmp/minecraft-console-in so `mc-send-to-console <cmd>` works
      # from a Portainer exec shell (e.g. /fml confirm, /fml cancel).
      - CREATE_CONSOLE_IN_PIPE=true
      - TYPE=CUSTOM
      - CUSTOM_SERVER=/data/lwjgl3ify-forgePatches.jar
      # GTNH 2.9.0-RC-2 upgrade (from 2.8.4): -Dfml.queryResult=confirm is
      # REMOVED below for the first boot. That flag also auto-confirms Forge's
      # "missing registry entries" prompt, which permanently deletes every
      # block/item/entity from a missing mod out of the world. After the world
      # has loaded cleanly on 2.9.0, re-add it if you still want the level.dat
      # fallback auto-accept described next.
      # Also check CUSTOM_SERVER's jar name matches the file in the 2.9.0 zip.
      # -Dfml.queryResult=confirm (when present): auto-accepts FML's "backup level.dat is
      # being used" prompt. That prompt normally waits for someone to type
      # /fml confirm at an interactive console — which doesn't exist here
      # — so without this flag a world that ever needs its level.dat
      # fallback (e.g. after an unclean shutdown) hangs forever at startup
      # instead of finishing boot.
      - JVM_OPTS=-Dfml.readTimeout=180 @java9args.txt
      - EXTRA_ARGS=nogui
      - INIT_MEMORY=6G
      - MAX_MEMORY=6G
      - OVERRIDE_SERVER_PROPERTIES=false   # don't let this image regenerate your existing server.properties
      # 120s wasn't enough for a real GTNH shutdown+save and caused a forced
      # kill mid-stop (see README incident log). 480s leaves real headroom;
      # stop_grace_period above must stay ahead of this.
      - STOP_DURATION=480
      - ENABLE_RCON=true
      # IMPORTANT: OVERRIDE_SERVER_PROPERTIES=false above means this env var
      # alone does NOT actually enable RCON on the running server — the
      # image only writes ENABLE_RCON/RCON_PASSWORD into server.properties
      # when it's allowed to manage that file, which we've told it not to.
      # server.properties (inherited from the old bare-metal setup, which
      # never used RCON) must be edited directly, once, to match this value:
      #   enable-rcon=true
      #   rcon.port=25575
      #   rcon.password=<same value as RCON_PASSWORD below>
      # Without that, mc-server-runner's graceful stop silently falls back
      # to typing "stop" into the console, which is slower and is what
      # triggered the forced-kill above.
      - RCON_PASSWORD=${RCON_PASSWORD:?set in .env}   # internal-only: no RCON port is published below
      # Confirmed via `id ncgramm` on the host: uid=1000, gid=1000.
      - UID=1000
      - GID=1000

  # Vanilla family server — see engineering-notes' "Family server" section
  # before the first boot: upgrading to a newer VERSION is one-way for the
  # world. Same bind-mount approach as gtnh-minecraft, so there's one copy
  # of the world. Only run now and then, so it deliberately doesn't start
  # at boot. The profile keeps stack redeploys from starting it, and the
  # existing container stays around for the dashboard, which refuses to run
  # this and GTNH at the same time. Compose changes to either Minecraft
  # service only apply with COMPOSE_PROFILES set — see engineering-notes.
  family-minecraft:
    profiles: ["family"]
    image: itzg/minecraft-server:java25
    container_name: family-minecraft
    restart: "no"
    stop_grace_period: 90s   # must exceed STOP_DURATION below, or Compose SIGKILLs mid-save
    ports:
      - "25566:25566"   # must match server.properties' server-port=25566; 25564 is taken by gtnh-minecraft
    volumes:
      - /home/ncgramm/FamilyServer:/data
    environment:
      - EULA=TRUE
      - TYPE=VANILLA
      # Pinned, not LATEST: clients need a matching Iris build before the
      # server moves, and a surprise upgrade can't be undone.
      - VERSION=26.3
      # 3G is enough for a small vanilla world, and GTNH's 6G on an 11G host
      # leaves little more if both run at once.
      - INIT_MEMORY=3G
      - MAX_MEMORY=3G
      - OVERRIDE_SERVER_PROPERTIES=false   # keep the existing level-name, difficulty, etc.
      - STOP_DURATION=60
      - ENABLE_RCON=true
      # Same catch as gtnh-minecraft: server.properties must be edited by
      # hand to match, since OVERRIDE_SERVER_PROPERTIES=false stops the image
      # from writing these. See engineering-notes' "Family server" section.
      - RCON_PASSWORD=${RCON_PASSWORD:?set in .env}   # internal-only: no RCON port is published below
      - UID=1000
      - GID=1000

  # FileBrowser Quantum, the maintained fork: upstream filebrowser/filebrowser
  # was archived in 2026 and gets no more security fixes. Can write to both
  # server folders, so it stays LAN/Tailscale-only and never gets the Docker
  # socket. Stop a server before editing its files — see engineering-notes.
  file-browser:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0-stable
    container_name: file-browser
    restart: unless-stopped
    ports:
      - "8082:80"   # NPM proxies files.marshmallowmc.com -> <host-ip>:8082
    volumes:
      - /home/ncgramm/GTNHServer:/servers/GTNHServer
      - /home/ncgramm/FamilyServer:/servers/FamilyServer
      - filebrowser_data:/home/filebrowser/data
    configs:
      - source: filebrowser_config
        target: /home/filebrowser/config.yaml
    environment:
      - FILEBROWSER_CONFIG=/home/filebrowser/config.yaml
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD:?set in .env}

  # Firefly III — Phase 3. Brand-new instance, its own dedicated MariaDB
  # (same pattern as Tandoor's dedicated postgres pairing). Behind NPM at
  # finance.marshmallowmc.com like everything else — a published port
  # here, proxied by <host-ip>:<port>, not a shared Docker network.
  firefly-db:
    image: mariadb:lts
    container_name: firefly-db
    restart: unless-stopped
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=firefly
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=${FIREFLY_DB_PASSWORD:?set in .env}
    volumes:
      - firefly_db_data:/var/lib/mysql

  firefly-app:
    image: fireflyiii/core:latest
    container_name: firefly-app
    restart: unless-stopped
    depends_on:
      - firefly-db
    ports:
      - "8080:8080"   # NPM proxies finance.marshmallowmc.com -> <host-ip>:8080
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    environment:
      # Exactly 32 characters, no `=` or `#` (breaks some .env-style
      # parsers). Generate with: tr -dc 'A-Za-z0-9' </dev/urandom | head -c32; echo
      - APP_KEY=${FIREFLY_APP_KEY:?set in .env}
      - APP_URL=https://finance.marshmallowmc.com
      - TRUSTED_PROXIES=**   # required behind any reverse proxy, NPM included
      - DB_CONNECTION=mysql
      - DB_HOST=firefly-db
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${FIREFLY_DB_PASSWORD:?set in .env}   # must match firefly-db above
      - STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN:?set in .env}
      - TZ=America/New_York

  # Official recommended companion service — daily cron for recurring
  # transactions, exchange rate updates, etc. Firefly runs fine without
  # it, but scheduled features silently never fire without it.
  firefly-cron:
    image: alpine
    container_name: firefly-cron
    restart: unless-stopped
    depends_on:
      - firefly-app
    environment:
      - TZ=America/New_York
      # Exactly 32 characters — same generation approach as APP_KEY above.
      - STATIC_CRON_TOKEN=${FIREFLY_STATIC_CRON_TOKEN:?set in .env}
    command: ["sh", "-c", "apk add tzdata && \
      (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
      echo \"0 3 * * * wget -qO- http://firefly-app:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\" \
      | crontab - && \
      crond -f -L /dev/stdout"]

  # Data Importer — the *manual* import path chosen over SimpleFIN/open
  # banking auto-sync on purpose: this only ever talks to Firefly's own
  # API, never to a bank or any third-party aggregator. You download a
  # statement (CSV/OFX/QFX) from your bank's site yourself and upload it
  # here; nobody's bank credentials ever leave the bank's own website.
  # See README's "Firefly III" section for the actual import workflow.
  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-importer
    restart: unless-stopped
    depends_on:
      - firefly-app
    ports:
      - "8081:8080"   # NPM proxies import.marshmallowmc.com -> <host-ip>:8081
    environment:
      - FIREFLY_III_URL=http://firefly-app:8080
      - VANITY_URL=https://finance.marshmallowmc.com
      - TRUSTED_PROXIES=**
      - TZ=America/New_York
      # A SEPARATE Personal Access Token from the dashboard's
      # FIREFLY_API_TOKEN — same creation steps (Options -> Profile ->
      # OAuth -> Personal Access Tokens), but its own token, so revoking
      # one integration's access later doesn't take the other down too.
      - FIREFLY_III_ACCESS_TOKEN=${FIREFLY_IMPORTER_TOKEN:-}

volumes:
  firefly_db_data:
  firefly_upload:
  filebrowser_data:

# Inline rather than a bind-mounted file: Portainer stacks resolve relative
# paths against its own data folder, where a repo file doesn't exist.
configs:
  filebrowser_config:
    content: |
      server:
        cacheDir: /home/filebrowser/data/tmp
        sources:
          - path: /servers/GTNHServer
            config:
              defaultEnabled: true
          - path: /servers/FamilyServer
            config:
              defaultEnabled: true
