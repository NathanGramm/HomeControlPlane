# Minecraft stack: GTNH, the family server, and their backups. Their files
# are managed from the dashboard's Minecraft page.

services:

  # GTNH server — see README's "Moving Minecraft into a container" section
  # before touching this on the real host. Bind-mounts the *existing*
  # ~/GTNHServer directory as-is (world, mods, config, whitelist, ops,
  # server.properties, the works) rather than copying anything, so there's
  # exactly one copy of your world at all times.
  gtnh-minecraft:
    profiles: ["gtnh"]   # stack redeploys skip it; see family-minecraft below
    image: itzg/minecraft-server:java17
    container_name: gtnh-minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 600s   # must exceed STOP_DURATION below, or Compose SIGKILLs mid-save
    ports:
      - "25564:25564"   # matches server.properties' server-port=25564 — no port-forward/SRV change needed
    volumes:
      - /home/ncgramm/GTNHServer:/data
    environment:
      - EULA=TRUE
      # Creates /tmp/minecraft-console-in so `mc-send-to-console <cmd>` works
      # from a Portainer exec shell (e.g. /fml confirm, /fml cancel).
      - CREATE_CONSOLE_IN_PIPE=true
      - TYPE=CUSTOM
      - CUSTOM_SERVER=/data/lwjgl3ify-forgePatches.jar
      # -Dfml.queryResult=confirm auto-accepts FML's "backup level.dat is
      # being used" prompt. That prompt waits for someone to type
      # /fml confirm at an interactive console, which doesn't exist here,
      # so without this flag a world that needs its level.dat fallback
      # (e.g. after an unclean shutdown) hangs forever at startup.
      # It ALSO auto-confirms Forge's "missing registry entries" prompt, which
      # permanently deletes every block/item/entity of a missing mod from the
      # world. Remove it before the first boot of any GTNH upgrade, and put it
      # back once the world has loaded cleanly.
      - JVM_OPTS=-Dfml.readTimeout=180 -Dfml.queryResult=confirm @java9args.txt
      - EXTRA_ARGS=nogui
      # Only the image healthcheck reads this (it ignores server.properties and
      # defaults to 25565); must match server-port.
      - SERVER_PORT=25564
      - INIT_MEMORY=6G
      - MAX_MEMORY=6G
      - OVERRIDE_SERVER_PROPERTIES=false   # don't let this image regenerate your existing server.properties
      # 120s wasn't enough for a real GTNH shutdown+save and caused a forced
      # kill mid-stop (see README incident log). 480s leaves real headroom;
      # stop_grace_period above must stay ahead of this.
      - STOP_DURATION=480
      - ENABLE_RCON=true
      # IMPORTANT: OVERRIDE_SERVER_PROPERTIES=false above means this env var
      # alone does NOT actually enable RCON on the running server — the
      # image only writes ENABLE_RCON/RCON_PASSWORD into server.properties
      # when it's allowed to manage that file, which we've told it not to.
      # server.properties (inherited from the old bare-metal setup, which
      # never used RCON) must be edited directly, once, to match this value:
      #   enable-rcon=true
      #   rcon.port=25575
      #   rcon.password=<same value as RCON_PASSWORD below>
      # Without that, mc-server-runner's graceful stop silently falls back
      # to typing "stop" into the console, which is slower and is what
      # triggered the forced-kill above.
      - RCON_PASSWORD=${RCON_PASSWORD:?set in .env}   # internal-only: no RCON port is published below
      # Confirmed via `id ncgramm` on the host: uid=1000, gid=1000.
      - UID=1000
      - GID=1000

  # Paper family server — see engineering-notes' "Family server" section
  # before the first boot: upgrading to a newer VERSION is one-way for the
  # world, and the first Paper boot needs the Nether/End check there. Paper,
  # not vanilla, because the whitelist ping-hiding and DriveBackupV2 are
  # plugins. This one is port-forwarded to the internet, unlike everything
  # else in this file. Same bind-mount approach as gtnh-minecraft, so there's one copy
  # of the world. Only run now and then, so it deliberately doesn't start
  # at boot. The profile keeps stack redeploys from starting it, and the
  # existing container stays around for the dashboard, which refuses to run
  # this and GTNH at the same time. Compose changes to either Minecraft
  # service only apply with COMPOSE_PROFILES set — see engineering-notes.
  family-minecraft:
    profiles: ["family"]
    image: itzg/minecraft-server:java25
    container_name: family-minecraft
    restart: "no"
    stop_grace_period: 90s   # must exceed STOP_DURATION below, or Compose SIGKILLs mid-save
    ports:
      - "25566:25566"   # must match server.properties' server-port=25566; 25564 is taken by gtnh-minecraft
    volumes:
      - /home/ncgramm/FamilyServer:/data
    environment:
      - EULA=TRUE
      # Was VANILLA, which silently stopped every plugin (DriveBackupV2
      # included) from loading. Spigot has no download builds for this image
      # to fetch; Paper runs the same plugins and does.
      - TYPE=PAPER
      # Pinned, not LATEST: clients need a matching Iris build before the
      # server moves, and a surprise upgrade can't be undone.
      - VERSION=26.3
      # Uncomment only if the log says "No build found for version 26.3 with
      # channel 'default'", i.e. Paper still marks 26.3 as beta. Remove it
      # again once Paper ships a stable 26.3 build.
      # - PAPER_CHANNEL=experimental
      # 3G is enough for a small world, and GTNH's 6G on an 11G host
      # leaves little more if both run at once.
      - INIT_MEMORY=3G
      - MAX_MEMORY=3G
      - OVERRIDE_SERVER_PROPERTIES=false   # keep the existing level-name, difficulty, etc.
      - STOP_DURATION=60
      # Only the image healthcheck reads this (it ignores server.properties and
      # defaults to 25565, so the container showed unhealthy); must match server-port.
      - SERVER_PORT=25566
      - ENABLE_RCON=true
      # Same catch as gtnh-minecraft: server.properties must be edited by
      # hand to match, since OVERRIDE_SERVER_PROPERTIES=false stops the image
      # from writing these. See engineering-notes' "Family server" section.
      - RCON_PASSWORD=${RCON_PASSWORD:?set in .env}   # internal-only: no RCON port is published below
      - UID=1000
      - GID=1000
      # Puts back vanilla behavior that Paper "fixes", so the dupe farms work.
      # Applied at each start, but only to a file that exists: the first Paper
      # boot creates config/paper-global.yml, so these take effect from the
      # second boot.
      - PATCH_DEFINITIONS=/patches/vanilla-exploits.json
    configs:
      - source: family_vanilla_exploits
        target: /patches/vanilla-exploits.json

  # Local backups of the family server, independent of any plugin. Uses RCON
  # to pause saving, so the copy is consistent. Not behind the `family`
  # profile: it's a few MB of RAM, runs all the time, and just waits while
  # the server is stopped, then backs up once it's up. After that it only
  # backs up again BACKUP_INTERVAL after someone has been online, so idle
  # days don't fill the folder with copies of the same world.
  # DriveBackupV2 (a plugin) is the off-site copy.
  family-minecraft-backup:
    image: itzg/mc-backup:2026.11.0   # pinned: backups should change on purpose
    container_name: family-minecraft-backup
    restart: unless-stopped
    environment:
      - RCON_HOST=family-minecraft
      - RCON_PORT=25575
      - RCON_PASSWORD=${RCON_PASSWORD:?set in .env}
      # Retry forever: the server is off most of the time, and the default
      # (5 tries) would turn every stopped day into a failed backup.
      - RCON_RETRIES=-1
      - RCON_RETRY_INTERVAL=30s
      - INITIAL_DELAY=2m
      - BACKUP_INTERVAL=6h
      - BACKUP_METHOD=tar
      # Keep by count, not just age: the server can sit unused for weeks, and
      # an age-only rule would delete every older backup on the next run.
      - PRUNE_BACKUPS_COUNT=20
      - PRUNE_BACKUPS_DAYS=90
      # After each backup, wait until a player is online (checked every 5
      # minutes), then back up BACKUP_INTERVAL later. The image checks with a
      # server-list ping, which the ping hiding blanks out for this
      # container, so the config below answers that check over RCON instead.
      - PAUSE_IF_NO_PLAYERS=true
      - PLAYERS_ONLINE_CHECK_INTERVAL=5m
      - TZ=America/New_York
    configs:
      - source: rcon_player_count
        target: /usr/local/bin/mc-monitor   # ahead of the real one (/usr/bin) on PATH
        mode: "0555"   # quoted: a string is always read as octal
    volumes:
      - /home/ncgramm/FamilyServer:/data:ro
      # The 4 TB disk, not ~/backups: the root disk is nearly full, and a copy
      # on the same disk as the world dies with it.
      - /mnt/storage4t/backups/family-minecraft:/backups

  # Same as family-minecraft-backup, for GTNH. The mod's own backups (in
  # ~/GTNHServer/backups, on the root disk) are excluded from the copy.
  gtnh-minecraft-backup:
    image: itzg/mc-backup:2026.11.0   # pinned: backups should change on purpose
    container_name: gtnh-minecraft-backup
    restart: unless-stopped
    environment:
      - RCON_HOST=gtnh-minecraft
      - RCON_PORT=25575
      - RCON_PASSWORD=${RCON_PASSWORD:?set in .env}
      - RCON_RETRIES=-1
      - RCON_RETRY_INTERVAL=30s
      - INITIAL_DELAY=2m
      - BACKUP_INTERVAL=6h
      - BACKUP_METHOD=tar
      - EXCLUDES=*.jar,cache,logs,*.tmp,backups
      - PRUNE_BACKUPS_COUNT=20
      - PRUNE_BACKUPS_DAYS=90
      - PAUSE_IF_NO_PLAYERS=false
      - TZ=America/New_York
    volumes:
      - /home/ncgramm/GTNHServer:/data:ro
      - /mnt/storage4t/backups/gtnh-minecraft:/backups

# Inline rather than a bind-mounted file: Portainer stacks resolve relative
# paths against its own data folder, where a repo file doesn't exist.
configs:
  # $$ is a literal $ (JSONPath root); a single $ would be read as a Compose variable.
  family_vanilla_exploits:
    content: |
      {"patches": [{"file": "/data/config/paper-global.yml", "ops": [
        {"$$set": {"path": "$$['unsupported-settings']['allow-piston-duplication']", "value": true}},
        {"$$set": {"path": "$$['unsupported-settings']['allow-unsafe-end-portal-teleportation']", "value": true}},
        {"$$set": {"path": "$$['unsupported-settings']['skip-tripwire-hook-placement-validation']", "value": true}},
        {"$$set": {"path": "$$['unsupported-settings']['allow-headless-pistons']", "value": true}},
        {"$$set": {"path": "$$['unsupported-settings']['allow-permanent-block-break-exploits']", "value": true}}
      ]}]}
  # Stands in for mc-monitor in family-minecraft-backup. PAUSE_IF_NO_PLAYERS
  # runs `mc-monitor status --show-player-count`, a server-list ping, which
  # Anti MOTD Scanner answers with empty data for an IP that never joined
  # (and enable-status=false doesn't answer at all), so backups would stop
  # for good. This reads the count from RCON's `list` instead, e.g. "There
  # are 1 of a max of 20 players online: Steve". A failure exits non-zero,
  # which the image logs and retries in 5 minutes. Every other mc-monitor
  # call goes to the real one.
  rcon_player_count:
    content: |
      #!/bin/bash
      if [[ " $$* " != *" --show-player-count "* ]]; then
        exec /opt/mc-monitor "$$@"
      fi
      out=$$(rcon-cli list) || exit 1
      if [[ $$out =~ There\ are\ ([0-9]+) ]]; then
        echo "$${BASH_REMATCH[1]}"
      else
        echo "unexpected reply to list: $$out"
        exit 1
      fi

# Shared with the other stacks (NPM, Pi-hole, Tandoor already use it), so
# containers reach each other by name across stacks, e.g. dashboard ->
# gtnh-minecraft and firefly-app.
networks:
  default:
    name: proxy-network
    external: true
