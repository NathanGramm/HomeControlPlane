# Dashboard stack: the control-plane app and its scoped Docker API proxy.
# Built from the repo root (Dockerfile there).
#
# Phase 2 change from Phase 1: home-control-plane no longer mounts the
# Docker socket itself. Instead, docker-socket-proxy holds the real socket
# and exposes only the specific calls the dashboard needs (list/inspect
# containers, start, stop) over plain TCP — nothing else, and nothing
# published to the host. The proxy lives on its own private network that only
# home-control-plane joins: "inspect" returns every container's environment
# (all the stacks' passwords) and start/stop works on any container, so it must
# not be reachable from proxy-network, where the internet-facing Minecraft
# servers live. See https://github.com/Tecnativa/docker-socket-proxy for the
# full list of toggles.

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0   # pinned, like Pi-hole: it guards the Docker API, so upgrade on purpose
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1    # GET/list/inspect — this alone grants no write access
      # POST must be 1: this proxy's rule order checks POST as a prerequisite
      # gate BEFORE the ALLOW_START/ALLOW_STOP checks below, so POST=0 was
      # silently blocking both actions rather than scoping them down as
      # intended. Every OTHER write action (create, kill, remove, exec, ...)
      # still has no matching ALLOW_* flag here, so it's still denied by the
      # proxy's own catch-all — only start/stop are actually reachable.
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No ports published — reached only by home-control-plane, at
    # docker-socket-proxy:2375 on the private docker-api network.
    networks:
      - docker-api

  home-control-plane:
    build: ../..   # repo root; Portainer clones the whole repo
    container_name: home-control-plane
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "3001:3000"   # NPM proxies dash.marshmallowmc.com -> <host-ip>:3001
    networks:
      - default      # proxy-network: NPM, Minecraft, Pi-hole, Jellyfin, Firefly
      - docker-api   # the only way to the Docker proxy
    volumes:
      - quests_data:/app/data   # the quest board (one JSON file)
      - /mnt/storage4t/backups:/backups:ro   # Minecraft backups, for the "Last backup" time
      - /mnt/storage4t/backups/quests:/quest-backups   # a dated copy of the board each day, last 30 kept
    environment:
      - PORT=3000
      - TZ=America/New_York   # the quest board's day rolls over at local midnight
      - QUESTS_BACKUP_DIR=/quest-backups
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Once `gtnh-minecraft` (below) is up, MINECRAFT_HOST is just its
      # container name — they land on the same default network because
      # they're defined in this same compose file, so dashboard-to-container
      # traffic never touches the published port at all. Confirmed via
      # server.properties: server-port is already set to 25564 (not
      # Minecraft's 25565 default), matching the port your SRV record
      # publishes externally — so it's the same 25564 on both sides here.
      - MINECRAFT_CONTAINER_NAME=gtnh-minecraft
      - MINECRAFT_HOST=gtnh-minecraft
      - MINECRAFT_PORT=25564
      - FAMILY_MINECRAFT_CONTAINER_NAME=family-minecraft
      - FAMILY_MINECRAFT_HOST=family-minecraft
      - FAMILY_MINECRAFT_PORT=25566
      # Same reasoning as MINECRAFT_HOST above — firefly-app's container
      # name works directly since they share this compose file's network.
      - FIREFLY_URL=http://firefly-app:8080
      # Can't be set until Firefly exists and you've logged in once to
      # create a Personal Access Token from its own UI — see README.
      # Leaving this blank/unset is fine: the dashboard just hides the
      # Finances section entirely until a real token is here.
      - FIREFLY_API_TOKEN=${FIREFLY_API_TOKEN:-}
      # Reached by container name over proxy-network. Blank credentials hide
      # the matching dashboard card.
      - PIHOLE_URL=http://pihole:80
      - PIHOLE_API_PASSWORD=${PIHOLE_API_PASSWORD:-}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}

volumes:
  quests_data:
    name: dashboard_quests_data

# Shared with the other stacks (NPM, Pi-hole, Tandoor already use it), so
# containers reach each other by name across stacks, e.g. dashboard ->
# gtnh-minecraft and firefly-app.
networks:
  default:
    name: proxy-network
    external: true
  docker-api:
    internal: true   # no route out; just the dashboard and the Docker proxy
