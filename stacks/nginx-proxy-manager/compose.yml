# Reverse proxy + TLS for every subdomain. Admin UI on :81.
services:
  app:
    image: 'jc21/nginx-proxy-manager:2.17.0'   # pinned: everything public goes through it, so upgrade on purpose
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'   # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81'   # Admin Web UI Port
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network

volumes:
  npm_data:
    name: nginx-proxy-manager_npm_data
  npm_letsencrypt:
    name: nginx-proxy-manager_npm_letsencrypt

networks:
  proxy-network:
    external: true
